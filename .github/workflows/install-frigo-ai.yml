name: Install Frigo AI

on:
  push:
    branches: [main]
    paths:
      - "app-bundle.part-*"
      - ".github/workflows/install-frigo-ai.yml"

permissions:
  contents: write

concurrency:
  group: install-frigo-ai
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Controleren of alle bundeldelen aanwezig zijn
        id: bundle
        shell: bash
        run: |
          shopt -s nullglob
          parts=(app-bundle.part-*)
          if [ "${#parts[@]}" -eq 4 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Installatie is al uitgevoerd of nog niet volledig geüpload."
          fi

      - name: App uitpakken en controleren
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          cat app-bundle.part-* > app-bundle.tar.gz.b64
          base64 --decode app-bundle.tar.gz.b64 > app-bundle.tar.gz
          echo "1e2d8d8d53e57695768094355ad3591a54d6332c8064a9155f52a86d3089818d  app-bundle.tar.gz" | sha256sum --check
          tar -xzf app-bundle.tar.gz
          rm -f app-bundle.part-* app-bundle.tar.gz.b64 app-bundle.tar.gz

      - name: Volledige Frigo AI-app opslaan
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om op te slaan."
            exit 0
          fi
          git commit -m "Install complete Frigo AI mobile app"
          git push

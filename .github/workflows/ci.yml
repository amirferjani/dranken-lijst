name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js 24 instellen
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: JavaScript-syntax controleren
        shell: bash
        run: |
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Netwerkloze tests uitvoeren
        run: node --test tests/*.test.mjs

      - name: Vastgelegde kassacatalogus valideren
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { validateProducts } from "./api/catalog.js";

            const snapshot = JSON.parse(await readFile("catalog.json", "utf8"));
            if (snapshot.schemaVersion !== 1) throw new Error("Onbekende catalogusversie.");
            if (snapshot.source?.repository !== "amirferjani/DLL_Injector") throw new Error("Onverwachte catalogusbron.");
            if (!/^[a-f0-9]{40}$/.test(snapshot.source?.revision || "")) throw new Error("Ongeldige bronrevisie.");
            if (snapshot.source?.activeParts !== 7) throw new Error("Onverwacht aantal kassabundeldelen.");

            const products = validateProducts(snapshot.products);
            if (products.length !== 260) throw new Error(`Verwacht 260 kassaproducten, kreeg ${products.length}.`);
            if (new Set(products.map((product) => product.id)).size !== 260) throw new Error("Product-ID’s zijn niet uniek.");

            console.log(`Catalogus geldig: ${products.length} producten uit ${snapshot.source.revision}.`);
          '
